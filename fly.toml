# Fly.io config for the LFT server.
# IMPORTANT: run exactly ONE machine. Statuses live in memory, so two machines
# would each hold half of them. Deploy with: fly deploy --ha=false

app = "osrs-lft"
primary_region = "lax"     # pick one near most of your players

[env]
  # Fits comfortably in a 512 MB machine; MAX_STORED_KEYS keeps the data well under this.
  JAVA_OPTS = "-Xmx320m -XX:+UseSerialGC"
  MAX_STORED_KEYS = "600000"

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: a stopped server would empty everyone's LFT list.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
